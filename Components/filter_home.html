<section class="container mx-auto my-8">

            <!-- Ano -->
            <div class="flex flex-col">
                <label class="text-sm font-semibold text-gray-600 mb-1">Ano</label>
                <select class="border border-gray-300 rounded p-2 w-full focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none">

                </select>

            <div class="flex flex-col">

                </select>
            </div>

                    <option value="">Selecione</option>
                </select>
            </div>

            <!-- Botão -->

            </div>
        </div>

</section>

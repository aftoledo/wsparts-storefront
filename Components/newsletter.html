<div class="flex flex-col w-full items-center bg-[#1a1a1a] relative overflow-hidden border-y border-white/5" style="padding-top: 5rem; padding-bottom: 6rem;">
    <!-- Background Image with Clean Overlay -->
    <div class="absolute inset-0 z-0 opacity-40 bg-cover bg-center" style="background-image: url('{{- store.urls.static_img}}newsletter_gears.png?v={{store.last_modified}}'); filter: grayscale(1) brightness(0.3);"></div>
    
    <div class="flex flex-col items-center w-full lg:max-w-[1330px] relative z-10 px-6">
        
        <!-- Simplified Header: Unified Title & Offer -->
        <div class="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-10 mb-12 w-full">
            <h3 class="text-white text-4xl lg:text-5xl font-black uppercase tracking-[0.1em] leading-none border-b-2 md:border-b-0 md:border-r-4 border-red-600 pb-2 md:pb-0 md:pr-10">
                Newsletter
            </h3>
            <p class="text-white text-base md:text-2xl font-bold uppercase tracking-tight text-center md:text-left">
                Cadastre-se e ganhe <span class="text-red-600 font-black text-2xl md:text-4xl" style="margin-left: 0.5rem;">10% OFF</span> na primeira compra
            </p>
        </div>

        <!-- Refined Wide Form Section: Comfortable & Visible (Using Inline Styles for Reliability) -->
        <form class="flex flex-col md:flex-row w-full lg:w-full max-w-5xl gap-4 items-center justify-center" style="margin-top: 2rem;" id="newsletter-form" onsubmit="newsletterSubmit(event);">
            <div class="relative w-full md:flex-1">
                <input type="text" class="w-full px-6 bg-white rounded-sm border-2 border-transparent focus:border-red-600 focus:ring-0 text-gray-900 placeholder-gray-400 transition-all font-semibold uppercase text-sm tracking-widest" style="height: 64px;" id="newsletter-form-name" placeholder="Digite seu nome" required>
            </div>

            <div class="relative w-full md:flex-1">
                <input type="email" class="w-full px-6 bg-white rounded-sm border-2 border-transparent focus:border-red-600 focus:ring-0 text-gray-900 placeholder-gray-400 transition-all font-semibold uppercase text-sm tracking-widest" style="height: 64px;" id="newsletter-form-email" placeholder="Digite seu e-mail" required>
            </div>
            
            {{~ if information_groups ~}}
                {{~ for value in information_groups ~}}
                    {{~ if value.display_type == 'TextoLivre' ~}}
                        <div class="relative w-full md:flex-1">
                            <input type="text" class="w-full px-6 bg-white rounded-sm border-2 border-transparent focus:border-red-600 focus:ring-0 text-gray-900 placeholder-gray-400 transition-all font-semibold uppercase text-sm tracking-widest" style="height: 64px;" id="newsletter-form-{{ value.field_name }}" placeholder="{{ value.field_name }}"
                            value-id="{{ value.id }}"
                            {{~ if value.required ~}}
                                required                           
                            {{~ end ~}}
                            >
                        </div>
                    {{~ end ~}}
                {{~ end ~}}
            {{~ end ~}}

            <div class="w-full md:w-56">
                <button type="submit" class="w-full text-white font-black uppercase transition-all tracking-[0.2em] text-base rounded-sm shadow-xl active:scale-95 transform hover:brightness-110" style="height: 64px; background-color: #00B44B; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);">
                    ENVIAR
                </button>
            </div>
        </form>

        <!-- Success/Error Messages -->
        <div class="mt-8 w-full flex justify-center min-h-[24px]">
            <div id="alert-newsletter" class="text-white text-xs font-bold uppercase tracking-[0.2em] opacity-80 text-center"></div>
        </div>
    </div>
</div>
